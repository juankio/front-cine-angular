<div 
      [routerLink]="['/pelicula', peliIdc]"
      class="group cursor-pointer aspect-[2/3] relative transition-transform duration-500 hover:-translate-y-2">
      
      <!-- Marco Clásico / Póster de Pared -->
      <div class="absolute inset-0 bg-black border-[3px] border-[#332B1A] group-hover:border-[#C5A059] transition-colors duration-500 p-2 shadow-2xl">
        <div class="relative w-full h-full overflow-hidden border border-[#332B1A] bg-black">
          
          <!-- Filtro de época -->
          <div class="absolute inset-0 bg-[#C5A059] mix-blend-color opacity-20 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>

          <!-- Imagen de Fondo (Poster) -->
          @if (urlImgc && !hasError()) {
            <img 
              [src]="urlImgc" 
              [alt]="peliTituloc" 
              (error)="hasError.set(true)"
              class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105 grayscale-[40%] group-hover:grayscale-0" 
            />
          } @else {
            <div class="absolute inset-0 flex flex-col items-center justify-center bg-secondary/50 text-[#C5A059] transition-transform duration-1000 group-hover:scale-105">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mb-4 opacity-50"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>
              <span class="font-display tracking-widest text-xl opacity-70">Cine POOR</span>
            </div>
          }

          <!-- Overlay Gradiente Oscuro -->
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-90 z-20 pointer-events-none"></div>

          <!-- Contenido de la Tarjeta (Texto Superpuesto) -->
          <div class="absolute inset-0 p-5 flex flex-col justify-end text-[#EAE6D7] z-30 pointer-events-none">
            
            <div class="flex items-center gap-2 mb-2">
              <span class="font-display tracking-[0.2em] text-xs font-semibold text-[#C5A059] border border-[#C5A059]/30 bg-black/80 px-2 py-0.5">
                {{ peliDurationc }} MIN
              </span>
            </div>
            
            <h3 class="font-display text-3xl leading-[0.9] drop-shadow-lg line-clamp-3 group-hover:text-[#C5A059] transition-colors duration-300">
              {{ peliTituloc }}
            </h3>
            
            <!-- Accion -->
            <div class="h-0 opacity-0 group-hover:h-10 group-hover:opacity-100 group-hover:mt-4 transition-all duration-500 overflow-hidden flex items-center justify-center border-t border-[#C5A059]/30">
              <span class="font-display tracking-[0.2em] text-sm uppercase text-[#C5A059]">Obtener Entradas</span>
            </div>
          </div>

        </div>
      </div>
    </div>
