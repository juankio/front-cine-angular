<nav class="sticky top-0 z-50 w-full border-b border-[#332B1A] bg-[#0A0A0A]/95 backdrop-blur shadow-md">
      <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-30 pointer-events-none mix-blend-overlay"></div>
      <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
        <div class="font-display text-3xl tracking-[0.2em] uppercase text-[#EAE6D7] drop-shadow-sm flex items-center gap-3">
          <!-- Logo Cine Clasico -->
          <div class="w-10 h-10 border border-[#C5A059] flex items-center justify-center relative">
            <div class="absolute inset-1 border border-[#C5A059]/50"></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </div>
          <span class="flex flex-col">
            <span class="leading-none text-2xl" style="text-shadow: 1px 1px 0px rgba(0,0,0,1), 2px 2px 0px rgba(197, 160, 89, 0.4);">CINE <span class="text-[#C5A059]">POOR</span></span>
            <span class="text-[8px] tracking-[0.4em] text-[#8C8775] mt-1 uppercase font-body">Est. 2026</span>
          </span>
        </div>

        <app-nav-menu-desktop [filteredLinks]="filteredLinks()" />

        <div class="flex items-center gap-4">
          <!-- Botón de Carrito -->
          <button routerLink="/carrito" class="relative group p-2 text-[#C5A059] hover:text-[#EAE6D7] transition-colors">
            <ng-icon hlm name="lucideShoppingCart" size="sm"></ng-icon>
            @if (cartStore.items().length > 0) {
              <span class="absolute top-0 right-0 inline-flex items-center justify-center w-4 h-4 text-[9px] font-bold text-black bg-[#C5A059] rounded-full border border-black transform translate-x-1/4 -translate-y-1/4 group-hover:scale-110 transition-transform">
                {{ cartStore.totalArticulos() }}
              </span>
            }
          </button>

          <button
            hlmBtn
              variant="ghost"
              size="icon"
              class="md:hidden text-[#C5A059] hover:bg-[#1A1A1A] hover:text-[#EAE6D7]"
              [attr.aria-expanded]="menuAbierto()"
            aria-label="Abrir menu de navegacion"
            (click)="toggleMenu()"
          >
            @if (menuAbierto()) {
              <ng-icon hlm name="lucideX" size="sm"></ng-icon>
            } @else {
              <ng-icon hlm name="lucideMenu" size="sm"></ng-icon>
            }
          </button>

          <div class="hidden md:flex items-center gap-4 border-l border-[#332B1A] pl-4">
            @if (authStore.isAuthenticated()) {
              <div class="flex flex-col items-end mr-2">
                <span class="text-[10px] font-display tracking-widest text-[#C5A059] uppercase">Miembro VIP</span>
                <span class="text-sm font-body text-[#EAE6D7]">{{ authStore.user()?.email || 'Usuario' }}</span>
              </div>
              <button class="text-xs font-display tracking-widest uppercase border border-[#7A0000] text-[#7A0000] hover:bg-[#7A0000] hover:text-white px-4 py-2 transition-colors" (click)="handleLogout()">Salir</button>
            } @else {
              <app-login-modal />
            }
          </div>
        </div>
      </div>

      @if (menuAbierto()) {
        <app-nav-menu-mobile
          [filteredLinks]="filteredLinks()"
          [isDarkMode]="isDarkMode()"
          (closeMenu)="menuAbierto.set(false)"
          (toggleTheme)="toggleTheme()"
        />
      }
    </nav>
