<ul class="hidden items-center gap-6 md:flex">
      @for (link of filteredLinks(); track link.to) {
        <li>
          <a
            [routerLink]="link.to"
            [fragment]="link.fragment"
            routerLinkActive="text-[#C5A059] border-b-2 border-[#C5A059]"
            [routerLinkActiveOptions]="{exact: link.exact}"
            class="font-display tracking-[0.15em] text-sm uppercase text-[#8C8775] hover:text-[#EAE6D7] pb-1 transition-colors"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
