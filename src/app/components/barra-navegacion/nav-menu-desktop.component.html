<ul class="hidden items-center gap-6 md:flex">
      @for (link of filteredLinks(); track link.to) {
        <li>
          <a
            [routerLink]="link.to"
            [fragment]="link.fragment"
            [class.text-[#C5A059]]="isActive(link)"
            [class.border-b-2]="isActive(link)"
            [class.border-[#C5A059]]="isActive(link)"
            class="font-display tracking-[0.15em] text-sm uppercase text-[#8C8775] hover:text-[#EAE6D7] pb-1 transition-colors block"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
