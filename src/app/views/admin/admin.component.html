<app-admin-layout>
      @if (isDashboard) {
        <div class="w-full max-w-7xl mx-auto p-8 md:p-12 animate-in fade-in zoom-in-95 duration-500 text-foreground relative z-10">
          <div class="mb-12 border-b-2 border-dashed border-[#332B1A] pb-6">
            <h1 class="text-5xl md:text-6xl font-display tracking-widest uppercase text-[#EAE6D7] mb-2 drop-shadow-sm">Panel de Dirección</h1>
            <p class="text-[#8C8775] text-lg font-body italic">Resumen general y estado de la taquilla.</p>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-[#111] border-2 border-[#332B1A] hover:border-[#C5A059] hover:-translate-y-1 transition-all duration-300 shadow-2xl relative group p-8">
              <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-[#C5A059] opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-[#C5A059] opacity-0 group-hover:opacity-100 transition-opacity"></div>
              
              <div class="relative z-10 flex justify-between items-start mb-8 border-b border-[#332B1A] pb-4">
                <div>
                  <h3 class="font-display tracking-[0.2em] uppercase text-2xl text-[#EAE6D7]">Películas</h3>
                  <p class="text-[#8C8775] text-xs font-display tracking-widest uppercase mt-1">En Cartelera</p>
                </div>
                <div class="p-3 bg-black border border-[#332B1A] text-[#C5A059] shadow-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>
                </div>
              </div>
              <div class="flex items-end justify-between">
                <p class="text-7xl font-display text-[#C5A059] drop-shadow-sm leading-none">{{ totalPeliculas() }}</p>
                <span class="text-[#8C8775] text-xs uppercase tracking-widest mb-1">Títulos</span>
              </div>
            </div>
            
            <div class="bg-[#111] border-2 border-[#332B1A] hover:border-[#C5A059] hover:-translate-y-1 transition-all duration-300 shadow-2xl relative group p-8">
              <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-[#C5A059] opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-[#C5A059] opacity-0 group-hover:opacity-100 transition-opacity"></div>
              
              <div class="relative z-10 flex justify-between items-start mb-8 border-b border-[#332B1A] pb-4">
                <div>
                  <h3 class="font-display tracking-[0.2em] uppercase text-2xl text-[#EAE6D7]">Dulcería</h3>
                  <p class="text-[#8C8775] text-xs font-display tracking-widest uppercase mt-1">Menús Activos</p>
                </div>
                <div class="p-3 bg-black border border-[#332B1A] text-[#C5A059] shadow-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
                </div>
              </div>
              <div class="flex items-end justify-between">
                <p class="text-7xl font-display text-[#C5A059] drop-shadow-sm leading-none">{{ totalMenus() }}</p>
                <span class="text-[#8C8775] text-xs uppercase tracking-widest mb-1">Combos</span>
              </div>
            </div>

            <div class="bg-[#111] border-2 border-[#332B1A] hover:border-[#C5A059] hover:-translate-y-1 transition-all duration-300 shadow-2xl relative group p-8">
              <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-[#C5A059] opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-[#C5A059] opacity-0 group-hover:opacity-100 transition-opacity"></div>
              
              <div class="relative z-10 flex justify-between items-start mb-8 border-b border-[#332B1A] pb-4">
                <div>
                  <h3 class="font-display tracking-[0.2em] uppercase text-2xl text-[#EAE6D7]">Salas</h3>
                  <p class="text-[#8C8775] text-xs font-display tracking-widest uppercase mt-1">Configuradas</p>
                </div>
                <div class="p-3 bg-black border border-[#332B1A] text-[#C5A059] shadow-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/><path d="M7 12h10"/></svg>
                </div>
              </div>
              <div class="flex items-end justify-between">
                <p class="text-7xl font-display text-[#C5A059] drop-shadow-sm leading-none">{{ totalSalas() }}</p>
                <span class="text-[#8C8775] text-xs uppercase tracking-widest mb-1">Espacios</span>
              </div>
            </div>
          </div>
        </div>
      }
      <router-outlet></router-outlet>
    </app-admin-layout>
