<app-default-layout>
  <div class="min-h-[70vh] flex items-center justify-center p-4">
    <section hlmCard class="w-full max-w-md">
      <div hlmCardHeader>
        <h3 hlmCardTitle class="text-2xl font-bold text-center">Recuperar Contraseña</h3>
        <p hlmCardDescription class="text-center">Ingresa tu nueva contraseña</p>
      </div>
      
      <div hlmCardContent>
        <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="space-y-4">
          
          <div class="space-y-2">
            <label for="password" class="text-sm font-medium leading-none">Nueva Contraseña</label>
            <input 
              hlmInput 
              type="password" 
              id="password" 
              name="password" 
              [(ngModel)]="password" 
              required 
              minlength="8"
              class="w-full" 
              placeholder="Mínimo 8 caracteres"
            >
          </div>

          <div class="space-y-2">
            <label for="confirmPassword" class="text-sm font-medium leading-none">Confirmar Contraseña</label>
            <input 
              hlmInput 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              [(ngModel)]="confirmPassword" 
              required 
              minlength="8"
              class="w-full" 
              placeholder="Vuelve a escribir tu contraseña"
            >
          </div>

          <button 
            hlmBtn 
            class="w-full mt-6" 
            type="submit" 
            [disabled]="!resetForm.valid || loading"
          >
            <span *ngIf="loading">Actualizando...</span>
            <span *ngIf="!loading">Actualizar Contraseña</span>
          </button>
        </form>
      </div>
    </section>
  </div>
</app-default-layout>
